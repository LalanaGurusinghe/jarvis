name: Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "icons/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Signing key: from repo secrets if you add them, otherwise created once and kept in the private build cache.
      - name: Restore signing key
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: ~/.jarvis-signing
          key: jarvis-signing-v1

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.jarvis-signing
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.jarvis-signing/jarvis.jks
            printf %s "$KS_PW" > ~/.jarvis-signing/pw
          elif [ ! -f ~/.jarvis-signing/jarvis.jks ]; then
            PW=$(openssl rand -hex 24)
            keytool -genkeypair -keystore ~/.jarvis-signing/jarvis.jks -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Jarvis, O=Lalana Gurusinghe, C=LK"
            printf %s "$PW" > ~/.jarvis-signing/pw
          fi
          PW=$(cat ~/.jarvis-signing/pw)
          echo "::add-mask::$PW"
          echo "JARVIS_KEYSTORE=$HOME/.jarvis-signing/jarvis.jks" >> "$GITHUB_ENV"
          echo "JARVIS_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Save signing key
        if: steps.keycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.jarvis-signing
          key: jarvis-signing-v1

      - name: Bundle the Jarvis interface into the app
        run: |
          mkdir -p android/app/src/main/assets/www/icons
          cp index.html manifest.webmanifest android/app/src/main/assets/www/
          cp icons/*.png android/app/src/main/assets/www/icons/

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |error:|What went wrong|Could not|> " build.log | grep -v "^> Task" | head -40 > errors.txt || true
          n=0
          while IFS= read -r line; do
            n=$((n+1)); [ $n -gt 40 ] && break
            echo "::error title=build::${line}"
          done < errors.txt

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk jarvis.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Jarvis for Android (build ${{ github.run_number }})
          body: |
            Install on your tablet: download **jarvis.apk** below, open it, and allow installing from this source.
            Built from ${{ github.sha }}.
          files: jarvis.apk
          make_latest: true
